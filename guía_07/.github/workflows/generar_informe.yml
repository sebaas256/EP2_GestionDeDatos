
name: Generar Informe Automático

on:
  schedule:
    - cron: '0 8 * * 1'  # Todos los lunes a las 8 AM
  workflow_dispatch:

jobs:
  generar-informe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Instalar librerías del sistema y dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libharfbuzz-subset0
          pip install pandas numpy matplotlib jinja2 weasyprint python-docx
      - name: Generar informe
        run: python scripts/generar_reporte.py
      - name: Subir artefactos
        uses: actions/upload-artifact@v3
        with:
          name: informe-generado
          path: exportaciones/
